Name:
  C: keyd
Summary:
  C: Key remapping daemon
Description:
  C: >-
    <p>`keyd` is a system-wide key remapping daemon for Linux that intercepts low-level inputs using evdev and uinput to remap
    keys across your entire system. It supports advanced features typically found in custom keyboard firmware, such as tap/hold
    key overloading, custom layers, hybrid modifiers, and device-specific configurations. Because it operates at the kernel
    level, your custom keybindings work consistently across X11, Wayland, and virtual consoles without depending on a specific
    desktop environment.</p>
