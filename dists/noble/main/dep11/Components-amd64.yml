Description:
  C: >-
    <p>kio-stash adds a virtual temporary folder (`stash:/`) to KDE file managers like Dolphin, allowing you to stage files
    and folders from different locations into a single view. Instead of creating physical temporary folders or relying on
    fragile multi-file selections, you can drag and drop items into the stash to organize a batch job. Once gathered, you
    can easily copy or move the entire staged collection to its final destination in one operation.</p>
