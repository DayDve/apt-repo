Name:
  C: grub-btrfs
Summary:
  C: GRUB menu entries for btrfs snapshots
Description:
  C: >-
    <p>grub-btrfs automatically integrates your Btrfs system snapshots into the GRUB bootloader menu, allowing you to boot
    directly into previous system states during startup. It automatically detects kernels, initramfs images, and snapshot
    metadata generated manually or by tools like Snapper, Timeshift, and Yabsnap. Additionally, it includes a background service
    that automatically updates your GRUB configuration whenever snapshots are created or deleted.</p>
