Type: console-application
ID: io.github.daydve.apt.bees
Package: bees
ProjectLicense: GPL-3.0-or-later
Name:
  C: bees
Summary:
  C: btrfs deduplication daemon
Description:
  C: >-
    <p>Bees is a background deduplication daemon for Btrfs filesystems that continuously scans for and consolidates duplicate
    data blocks to recover disk space. It operates on live filesystems and automatically self-throttles, working seamlessly
    alongside Btrfs snapshots, reflinks, and transparent compression. Designed for high efficiency, it uses a fixed-size persistent
    hash table that requires as little as 1 GB of RAM per 10 TB of unique data.</p>
Categories:
- System
- Filesystem
Url:
  homepage: https://github.com/Zygo/bees
Provides:
  binaries:
  - bees
