- Type: console-application
  ID: io.github.daydve.apt.grub-btrfs
  Name:
    C: grub-btrfs
  Summary:
    C: GRUB menu entries for btrfs snapshots
  Description:
    C: >-
      <p>grub-btrfs automatically integrates your Btrfs system snapshots into the GRUB bootloader menu, allowing you to boot directly into previous system states during startup. It automatically detects kernels, initramfs images, and snapshot metadata generated manually or by tools like Snapper, Timeshift, and Yabsnap. Additionally, it includes a background service that automatically updates your GRUB configuration whenever snapshots are created or deleted.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: grub-btrfs
  Url:
    Homepage: https://github.com/Antynea/grub-btrfs
  Provides:
    Binaries:
    - grub-btrfs
  Categories:
    - System
    - Boot
- Type: console-application
  ID: io.github.daydve.apt.keyd
  Name:
    C: keyd
  Summary:
    C: Key remapping daemon
  Description:
    C: >-
      <p>`keyd` is a system-wide key remapping daemon for Linux that intercepts low-level inputs using evdev and uinput to remap keys across your entire system. It supports advanced features typically found in custom keyboard firmware, such as tap/hold key overloading, custom layers, hybrid modifiers, and device-specific configurations. Because it operates at the kernel level, your custom keybindings work consistently across X11, Wayland, and virtual consoles without depending on a specific desktop environment.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: keyd
  Url:
    Homepage: https://github.com/rvaiya/keyd
  Provides:
    Binaries:
    - keyd
  Categories:
    - System
    - Hardware
- Type: addon
  ID: io.github.daydve.apt.kio-stash
  Name:
    C: kio-stash
  Summary:
    C: Virtual folder protocol (stash:/) for Dolphin on KDE Plasma 6
  Description:
    C: >-
      <p>kio-stash adds a virtual temporary folder (`stash:/`) to KDE file managers like Dolphin, allowing you to stage files and folders from different locations into a single view. Instead of creating physical temporary folders or relying on fragile multi-file selections, you can drag and drop items into the stash to organize a batch job. Once gathered, you can easily copy or move the entire staged collection to its final destination in one operation.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: kio-stash
  Url:
