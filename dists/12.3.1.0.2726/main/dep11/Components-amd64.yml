- Type: desktop-application
  ID: io.github.daydve.apt.ayugram
  Name:
    C: ayugram
  Summary:
    C: Telegram client with enhanced features
  Description:
    C: >-
      <p>AyuGram is a modified Telegram Desktop client that adds advanced privacy controls and expanded messaging features to the standard Telegram interface. It includes a flexible ghost mode to hide your online status and read receipts, as well as anti-recall functionality that saves deleted and edited message history locally. Additionally, it offers font and theme customization, built-in message translation, streamer mode, and local Telegram Premium options.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: ayugram
  Url:
    Homepage: https://github.com/AyuGram/AyuGramDesktop
  Icon:
    Cache: ayugram
    Theme: hicolor
    Size: 48
  Launchable:
    desktop-id: ayugram.desktop
  Provides:
    Binaries:
    - ayugram
  Categories:
    - InstantMessaging
- Type: console-application
  ID: io.github.daydve.apt.bees
  Name:
    C: bees
  Summary:
    C: btrfs deduplication daemon
  Description:
    C: >-
      <p>Bees is a background deduplication daemon for Btrfs filesystems that continuously scans for and consolidates duplicate data blocks to recover disk space. It operates on live filesystems and automatically self-throttles, working seamlessly alongside Btrfs snapshots, reflinks, and transparent compression. Designed for high efficiency, it uses a fixed-size persistent hash table that requires as little as 1 GB of RAM per 10 TB of unique data.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: bees
  Url:
    Homepage: https://github.com/Zygo/bees
  Provides:
    Binaries:
    - bees
  Categories:
    - System
    - Filesystem
- Type: desktop-application
  ID: io.github.daydve.apt.btrfs-assistant
  Name:
    C: btrfs-assistant
  Summary:
    C: GUI management tool for Btrfs filesystem
  Description:
    C: >-
      <p>Btrfs Assistant provides a graphical interface for managing Btrfs subvolumes, filesystem settings, and maintenance routines. It integrates directly with Snapper to let you browse, create, and restore system snapshots directly from the GUI. You can also use it to monitor subvolume space usage and schedule or manually run routine operations like scrubs, balances, and defragmentation.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: btrfs-assistant
  Url:
    Homepage: https://gitlab.com/btrfs-assistant/btrfs-assistant
  Icon:
