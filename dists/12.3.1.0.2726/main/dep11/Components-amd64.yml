  ID: io.github.daydve.apt.localsend
  Name:
    C: localsend
  Summary:
    C: Cross-platform file sharing over local network
  Description:
    C: >-
      <p>LocalSend transfers files and text messages directly between devices on your local network without requiring an internet connection or third-party servers. It automatically detects nearby devices running the app, allowing you to quickly share documents, media, and clipboard content across Linux, Android, iOS, Windows, and macOS. Because all traffic stays within your local Wi-Fi or Ethernet connection, transfers are fast, private, and use zero internet bandwidth.</p>
