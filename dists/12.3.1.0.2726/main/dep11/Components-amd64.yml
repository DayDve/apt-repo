- Type: font
  ID: io.github.daydve.apt.fonts-noto-lite
  Name:
    C: fonts-noto-lite
  Summary:
    C: Hide non-Latin/Cyrillic Noto fonts from font selection dialogs on Ubuntu/Debian
  Description:
    C: >-
      <p>fonts-noto-lite declutters font selection menus in Ubuntu and Debian by hiding non-Latin and non-Cyrillic Noto font families from desktop applications. It uses dpkg-divert and system fontconfig rules to disable dozens of script-specific families—such as Arabic, Thai, Devanagari, and CJK—while keeping standard Noto Sans, Serif, Mono, and Color Emoji available. Installing this package also replaces fonts-noto-extra, freeing around 334 MB of disk space without breaking base package dependencies.</p>
  MetadataLicense: CC0-1.0
  ProjectLicense: GPL-3.0-or-later
  Package: fonts-noto-lite
  Url:
    Homepage: https://github.com/DayDve/fonts-noto-lite
  Provides:
    Binaries:
    - fonts-noto-lite
  Categories:
    - Fonts
- Type: console-application
  ID: io.github.daydve.apt.glab
  Name:
    C: glab
  Summary:
    C: Official GitLab command-line tool
  Description:
    C: >-
      <p>`glab` is a command-line tool that lets you manage GitLab repositories, issues, merge requests, and CI/CD pipelines directly from your terminal. You can create and review merge requests, check build pipeline statuses, manage project issues, and publish releases without opening a web browser. It works with both GitLab.com and self-hosted GitLab instances.</p>
