Summary:
  C: Hide non-Latin/Cyrillic Noto fonts from font selection dialogs on Ubuntu/Debian
Description:
  C: >-
    <p>fonts-noto-lite declutters font selection menus in Ubuntu and Debian by hiding non-Latin and non-Cyrillic Noto font
    families from desktop applications. It uses dpkg-divert and system fontconfig rules to disable dozens of script-specific
    families—such as Arabic, Thai, Devanagari, and CJK—while keeping standard Noto Sans, Serif, Mono, and Color Emoji available.
    Installing this package also replaces fonts-noto-extra, freeing around 334 MB of disk space without breaking base package
    dependencies.</p>
