    at optimal intervals. It uses smart scheduling to show you exactly the cards you are struggling with, so you spend your
    time efficiently instead of re-studying what you already know. You can create your own decks and cards for anything you
    want to learn, or download shared decks covering languages, medicine, law, math, and more. This package bundles Anki's
