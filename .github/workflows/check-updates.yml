name: Check updates

on:
  push:
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/package'
    branches:
      - apps
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App to build (leave empty for all)
        required: false
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          INPUT_APP: ${{ inputs.app }}
        run: |
          if [ -n "$INPUT_APP" ]; then
            echo "matrix=$(jq -nc --arg a "$INPUT_APP" '{app:[$a]}')" >> "$GITHUB_OUTPUT"
          else
            apps=$(ls -d apps/*/ | sed 's|apps/||;s|/||' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix={\"app\":$apps}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    concurrency:
      group: build-${{ matrix.app }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Get current version
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tags=$(gh release list --repo ${{ github.repository }} --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null); then
            echo "gh release list failed, skipping"
            echo "version=SKIP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag belongs to the longest app name it is prefixed by
          # (so "foo" never claims tags of "foo-2bar", and vice versa):
          # drop candidate tags claimed by strictly longer app names
          others=$(ls -d apps/*/ | sed 's|apps/||;s|/||' \
            | awk -v a="${{ matrix.app }}" 'length($0) > length(a)' \
            | sed 's/[][\.*^$()+?{}|\/]/\\&/g' | paste -sd'|')
          cand=$(echo "$tags" | grep -E "^${{ matrix.app }}-[0-9]")
          if [ -n "$others" ]; then
            cand=$(echo "$cand" | grep -Ev "^(${others})-")
          fi
          tag=$(echo "$cand" | sort -V | tail -1)
          if [ -n "$tag" ]; then
            echo "version=$(echo "$tag" | sed "s/^${{ matrix.app }}-//")" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check update
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.current.outputs.version }}" = "SKIP" ]; then
            echo "Skipped due to API failure"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f apps/${{ matrix.app }}/package ]; then
            echo "No package for ${{ matrix.app }}, skipping"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source apps/build.sh
          source apps/${{ matrix.app }}/package
          if check_update "${{ steps.current.outputs.version }}"; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bash apps/build.sh ${{ matrix.app }} "${{ steps.current.outputs.version }}"

      - name: Notify Failure
        if: failure() && steps.check.outputs.update == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED_STEP=$(curl -sH "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r --arg name "build (${{ matrix.app }})" \
              '.jobs[] | select(.name == $name) | .steps[] | select(.conclusion == "failure") | .name')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '❌ <b>%s</b> failed\nШаг: %s\n<a href="%s">Открыть</a>' \
            "${{ matrix.app }}" "${FAILED_STEP:-unknown}" "$RUN_URL")
          curl -sS \
            --form-string "chat_id=$TG_OWNER_ID" \
            --form-string "text=$TEXT" \
            --form-string "parse_mode=HTML" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" | grep -v '"ok":true' || true

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check if any build happened
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json jobs --jq '
            [.jobs[] | select(.name | startswith("build (")) | .steps[] | select(.name == "Build" and .conclusion == "success")] | length
          ')
          if [ "$built" -gt 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect built apps
        if: steps.check.outputs.deploy == 'true'
        id: apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps=$(gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json jobs --jq '
            [.jobs[] | select(.name | startswith("build (")) |
             select(.steps[] | select(.name == "Build" and .conclusion == "success")) |
             .name | ltrimstr("build (") | rtrimstr(")")]
          ' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "list=$apps" >> "$GITHUB_OUTPUT"

      - name: Trigger apt repo deploy
        if: steps.check.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-apt.yml --repo ${{ github.repository }} \
            -f changed_apps='${{ steps.apps.outputs.list }}'
