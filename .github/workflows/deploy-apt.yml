name: Deploy apt repository

on:
  workflow_dispatch:
    inputs:
      changed_apps:
        description: 'JSON array of changed app names (empty = all)'
        required: false
        type: string
        default: '[]'

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-apt
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: apt

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils dpkg-dev gnupg appstream

      - name: Import GPG key
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY" > /tmp/gpg.key
          gpg --batch --yes --import /tmp/gpg.key

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/by-tag
          gh release list --repo $GITHUB_REPOSITORY --json tagName --jq '.[].tagName' | while read tag; do
            gh release download "$tag" --repo $GITHUB_REPOSITORY --dir "/tmp/by-tag/$tag" --pattern '*.deb' 2>/dev/null || true
          done

      - name: Generate Packages
        run: |
          > /tmp/tag-map
          > /tmp/pool-map-entries
          for tag_dir in /tmp/by-tag/*/; do
            [ -d "$tag_dir" ] || continue
            tag=$(basename "$tag_dir")
            for deb in "$tag_dir"*.deb; do
              [ -f "$deb" ] || continue
              name=$(basename "$deb")
              usc=$(echo "$name" | tr -cd '_' | wc -c)
              if [ "$usc" -ge 2 ]; then
                distro=$(echo "$name" | rev | cut -d_ -f2 | rev)
              else
                distro=noble
              fi
              mkdir -p "/tmp/pool/$distro/main"
              cp "$deb" "/tmp/pool/$distro/main/$name"
              echo "$distro|$name|$tag" >> /tmp/tag-map
            done
          done

          for distro_dir in /tmp/pool/*/; do
            [ -d "$distro_dir" ] || continue
            distro=$(basename "$distro_dir")
            [ -z "$(ls "/tmp/pool/$distro/main/"*.deb 2>/dev/null)" ] && continue

            cd "/tmp/pool/$distro"
            dpkg-scanpackages --multiversion main > Packages

            # rewrite Filename to full relative path from repo root
            sed -i "s|^Filename: main/|Filename: pool/$distro/main/|" Packages

            mkdir -p "$GITHUB_WORKSPACE/dists/$distro/main/binary-amd64"
            cp Packages "$GITHUB_WORKSPACE/dists/$distro/main/binary-amd64/Packages"
            gzip -9kf "$GITHUB_WORKSPACE/dists/$distro/main/binary-amd64/Packages"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Generate pool map
        run: |
          echo -n '{' > "$GITHUB_WORKSPACE/pool-map.json"
          first=true
          while IFS='|' read -r _distro deb_name tag; do
            $first || echo -n ',' >> "$GITHUB_WORKSPACE/pool-map.json"
            first=false
            printf '"%s":"%s"' "$deb_name" "$tag" >> "$GITHUB_WORKSPACE/pool-map.json"
          done < /tmp/tag-map
          echo '}' >> "$GITHUB_WORKSPACE/pool-map.json"

      - name: Get package info from apps
        run: |
          git fetch origin apps
          for app in $(git ls-tree --name-only origin/apps:apps/ | grep -v '^template$'); do
            pkg_file="origin/apps:apps/$app/package"
            url=$(git show "$pkg_file" | awk -F'"' '/^SOURCE_URL=/{print $2}')
            desc=$(git show "$pkg_file" | awk -F'"' '/^DESCRIPTION=/{print $2}')
            type=$(git show "$pkg_file" | awk -F'"' '/^APPSTREAM_TYPE=/{print $2}')
            cats=$(git show "$pkg_file" | awk -F'"' '/^APPSTREAM_CATEGORIES=/{print $2}')
            icon_source=$(git show "$pkg_file" | awk -F'"' '/^ICON_SOURCE=/{print $2}')
            icon_path=$(git show "$pkg_file" | awk -F'"' '/^ICON_PATH=/{print $2}')
            [ -n "$url" ] && echo "$app|$url|$desc|$type|$cats|$icon_source|$icon_path"
          done > /tmp/pkg-info

      - name: Generate AppStream metadata
        run: |
          git fetch origin apps
          for distro in dists/*/; do
            [ -d "$distro" ] || continue
            distro=$(basename "$distro")
            # Remove old dep-11 path; use dep11 (without dash) to match APT's 50appstream
            rm -rf "dists/$distro/main/dep-11"
            mkdir -p "dists/$distro/main/dep11"
            xml_file="dists/$distro/main/dep11/Components-amd64.xml"
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "$xml_file"
            echo '<components origin="daydve-apt">' >> "$xml_file"
            while IFS='|' read -r app url desc type cats icon_source icon_path; do
              [ -z "$app" ] && continue
              [ -z "$type" ] && type="console-application"
              printf '  <component type="%s">\n' "$type" >> "$xml_file"
              printf '    <id>io.github.daydve.apt.%s</id>\n' "$app" >> "$xml_file"
              printf '    <name>%s</name>\n' "$app" >> "$xml_file"
              printf '    <summary>%s</summary>\n' "$desc" >> "$xml_file"
              printf '    <metadata_license>CC0-1.0</metadata_license>\n' >> "$xml_file"
              printf '    <project_license>GPL-3.0-or-later</project_license>\n' >> "$xml_file"
              printf '    <pkgname>%s</pkgname>\n' "$app" >> "$xml_file"
              printf '    <url type="homepage">%s</url>\n' "$url" >> "$xml_file"
              if [ "$type" = "desktop-application" ]; then
                printf '    <launchable type="desktop-id">%s.desktop</launchable>\n' "$app" >> "$xml_file"
                printf '    <icon type="stock">%s</icon>\n' "$app" >> "$xml_file"
              fi
              printf '    <provides>\n      <binary>%s</binary>\n    </provides>\n' "$app" >> "$xml_file"
              if [ -n "$cats" ]; then
                echo '    <categories>' >> "$xml_file"
                IFS=';' read -ra CAT_ARRAY <<< "$cats"
                for cat in "${CAT_ARRAY[@]}"; do
                  printf '      <category>%s</category>\n' "$cat" >> "$xml_file"
                done
                echo '    </categories>' >> "$xml_file"
              fi
              echo '  </component>' >> "$xml_file"
            done < /tmp/pkg-info
            echo '</components>' >> "$xml_file"
            yml_plain="dists/$distro/main/dep11/Components-amd64.yml"
            appstreamcli convert "$xml_file" "$yml_plain" --format yaml
            gzip -9kf "$yml_plain"
            rm -f "$xml_file"
          done

      - name: Generate icon tarballs
        run: |
          sudo apt-get install -y -qq librsvg2-bin imagemagick 2>/dev/null

          for distro_dir in /tmp/pool/*/; do
            [ -d "$distro_dir" ] || continue
            distro=$(basename "$distro_dir")

            for size in 48 64 128; do
              mkdir -p "/tmp/icons-$size"
            done

            for deb in "/tmp/pool/$distro/main/"*.deb; do
              [ -f "$deb" ] || continue
              deb_name=$(basename "$deb")

              tag=$(grep "|$deb_name|" /tmp/tag-map | head -1 | cut -d'|' -f3)
              [ -z "$tag" ] && continue
              # tag = <app>-<version>
              app=$(echo "$tag" | sed -E 's/-[0-9].*//')
              [ -z "$app" ] && continue

              # Only desktop-applications get icons
              type=$(awk -F'|' -v a="$app" '$1==a{print $4}' /tmp/pkg-info)
              [ "$type" != "desktop-application" ] && continue

              icon_source=$(awk -F'|' -v a="$app" '$1==a{print $6}' /tmp/pkg-info)
              icon_path=$(awk -F'|' -v a="$app" '$1==a{print $7}' /tmp/pkg-info)
              [ -z "$icon_source" ] && icon_source="deb"

              icon_file=""
              case "$icon_source" in
                file)
                  icon_file="/tmp/icon-$app"
                  git show "origin/apps:apps/$app/$icon_path" > "$icon_file" 2>/dev/null || icon_file=""
                  ;;
                url)
                  icon_file="/tmp/icon-$app"
                  curl -fsSL -o "$icon_file" "$icon_path" 2>/dev/null || icon_file=""
                  ;;
                deb|'')
                  if [ -n "$icon_path" ]; then
                    icon_file="/tmp/icon-$app"
                    icon_arch="${icon_path#./}"
                    icon_arch="./$icon_arch"
                    dpkg-deb --fsys-tarfile "$deb" | tar -xO "$icon_arch" > "$icon_file" 2>/dev/null || icon_file=""
                  fi
                  if [ -z "$icon_file" ] || [ ! -s "$icon_file" ]; then
                    # Auto-discover: find largest PNG in hicolor/*/apps/
                    icon_in_deb=$(dpkg-deb --fsys-tarfile "$deb" | tar -t 2>/dev/null \
                      | grep -oP '\./usr/share/icons/hicolor/\d+x\d+/apps/.*\.png' \
                      | sort -t/ -k5 -rV | head -1)
                    if [ -n "$icon_in_deb" ]; then
                      icon_file="/tmp/icon-$app"
                      dpkg-deb --fsys-tarfile "$deb" | tar -xO "$icon_in_deb" > "$icon_file" 2>/dev/null || icon_file=""
                    fi
                  fi
                  ;;
              esac

              [ -z "$icon_file" ] && [ ! -f "$icon_file" ] && continue
              [ ! -s "$icon_file" ] && { rm -f "$icon_file"; continue; }

              # Determine type and dimensions
              mime=$(file -b --mime-type "$icon_file" 2>/dev/null)

              if [ "$mime" = "image/svg+xml" ]; then
                for S in 48 64 128; do
                  rsvg-convert -w "$S" -h "$S" -o "/tmp/icons-$S/${app}_${app}.png" "$icon_file" 2>/dev/null
                done
                rm -f "$icon_file"
                continue
              fi

              # PNG — get dimensions
              read -r W H <<< "$(identify -format '%w %h' "$icon_file" 2>/dev/null)"
              if [ -z "$W" ] || [ "$W" -eq 0 ]; then
                rm -f "$icon_file"
                continue
              fi

              for S in 128 64 48; do
                if [ "$S" -le "$W" ] || { [ "$W" -lt 48 ] && [ "$S" -eq 48 ]; }; then
                  convert -resize "${S}x${S}" "$icon_file" "/tmp/icons-$S/${app}_${app}.png" 2>/dev/null
                fi
              done
              rm -f "$icon_file"
            done
          done

          for distro_dir in dists/*/; do
            [ -d "$distro_dir" ] || continue
            distro=$(basename "$distro_dir")
            for size in 48 64 128; do
              src="/tmp/icons-$size"
              if [ -n "$(ls "$src"/*.png 2>/dev/null)" ]; then
                tar czf "$GITHUB_WORKSPACE/dists/$distro/main/dep11/icons-${size}x${size}.tar.gz" -C "$src" .
              fi
            done
          done

      - name: Generate packages.json
        run: |
          echo -n '[' > "$GITHUB_WORKSPACE/packages.json"
          first=true
          seen=""
          while IFS='|' read -r distro deb_name tag; do
            app=$(echo "$tag" | sed -E 's/-[0-9].*//')
            echo " $seen " | grep -q " $app " && continue
            seen="$seen $app"
            source_url=$(awk -F'|' -v a="$app" '$1==a{print $2}' /tmp/pkg-info)
            desc=$(awk -F'|' -v a="$app" '$1==a{print $3}' /tmp/pkg-info)
            if [ -z "$desc" ]; then
              desc=$(dpkg-deb -f "/tmp/pool/$distro/main/$deb_name" Description 2>/dev/null | head -1 || echo "")
            fi
            $first || echo -n ',' >> "$GITHUB_WORKSPACE/packages.json"
            first=false
            jq -n --arg name "$app" --arg desc "$desc" --arg source "$source_url" '{name:$name,description:$desc,source:$source}' >> "$GITHUB_WORKSPACE/packages.json"
          done < /tmp/tag-map
          echo -n ']' >> "$GITHUB_WORKSPACE/packages.json"

      - name: Generate Release
        run: |
          for distro in dists/*/; do
            [ -d "$distro" ] || continue
            distro=$(basename "$distro")

            apt-ftparchive release \
              -o APT::FTPArchive::Release::Origin="DayDve" \
              -o APT::FTPArchive::Release::Label="DayDve apt repo" \
              -o "APT::FTPArchive::Release::Suite=$distro" \
              -o "APT::FTPArchive::Release::Codename=$distro" \
              -o "APT::FTPArchive::Release::Architectures=amd64" \
              -o "APT::FTPArchive::Release::Components=main" \
              "dists/$distro" > "dists/$distro/Release"

            # apt-ftparchive picks up dep11 files automatically
          done

      - name: Sign Release
        run: |
          for distro in dists/*/; do
            [ -d "$distro" ] || continue
            distro=$(basename "$distro")
            pushd "dists/$distro"
            gpg --batch --yes --detach-sign --armor -o Release.gpg Release
            gpg --batch --yes --clearsign -o InRelease Release
            popd
          done

      - name: Export public key
        run: |
          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | head -1 | cut -d: -f5)
          gpg --armor --export "$KEYID" > apt-key.asc

      - name: Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          rm -rf dists/noble/main/binary-i386 2>/dev/null || true
          # Clean up old dep-11 path (with dash) — APT expects dep11 (no dash)
          rm -rf dists/*/main/dep-11 2>/dev/null || true
          git add -A
          git commit -m "deploy build $GITHUB_RUN_NUMBER"
          git push

      - name: Update README on apps
        run: |
          cp "$GITHUB_WORKSPACE/packages.json" /tmp/packages.json
          git fetch origin apps
          git checkout apps
          python3 scripts/gen_readme.py
          git add README.md
          git diff --cached --quiet || (
            git -c user.name='github-actions' -c user.email='github-actions@github.com' commit -m "auto-update README from packages metadata"
            git push
          )

  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILED_STEP=$(curl -sH "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r '.jobs[] | select(.name == "deploy") | .steps[] | select(.conclusion == "failure") | .name')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '❌ Deploy failed\nШаг: %s\n<a href="%s">Открыть</a>' \
            "${FAILED_STEP:-unknown}" "$RUN_URL")
          curl -sS \
            --form-string "chat_id=$TG_OWNER_ID" \
            --form-string "text=$TEXT" \
            --form-string "parse_mode=HTML" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" | grep -v '"ok":true'

  notify-success:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: apps

      - name: Send notifications
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANGED_APPS: ${{ inputs.changed_apps }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: |
          apps=$(echo "$CHANGED_APPS" | jq -r '.[]?' 2>/dev/null || true)
          # Handle double-encoded JSON arrays from workflow_dispatch
          if echo "$apps" | grep -q '^\['; then
            apps=$(echo "$apps" | jq -r '.[]?' 2>/dev/null || true)
          fi
          if [ -z "$apps" ]; then
            echo "No changed apps, skipping"
            exit 0
          fi

          echo "$apps"

          # Start local Bot API server
          docker run -d --rm \
            -p 8081:8081 \
            --name telegram-bot-api \
            -e TELEGRAM_API_ID="$API_ID" \
            -e TELEGRAM_API_HASH="$API_HASH" \
            aiogram/telegram-bot-api:latest \
            --local

          for i in $(seq 1 30); do
            if curl -s "http://localhost:8081/bot$TG_TOKEN/getMe" > /dev/null 2>&1; then
              echo "Bot API ready"
              break
            fi
            sleep 1
          done

          pip install -q requests

          while read -r app; do
            [ -z "$app" ] && continue
            if [ ! -f "apps/$app/package" ]; then
              echo "No package for $app, skipping"
              continue
            fi
            echo "=== Processing $app ==="

            # Get package metadata from source
            source apps/build.sh
            source "apps/$app/package"
            desc="$DESCRIPTION"
            src="$SOURCE_URL"
            changelog_url="${CHANGELOG_URL:-$SOURCE_URL}"
            echo "desc=$desc src=$src changelog_url=$changelog_url"

            # Get latest release info
            tag=$(gh release list --repo ${{ github.repository }} --json tagName --jq '.[].tagName' \
              | grep "^${app}-[0-9]" | sort -V | tail -1)
            echo "tag=$tag"
            [ -z "$tag" ] && continue
            ver=$(echo "$tag" | sed "s/^${app}-//")

            body=$(gh release view "$tag" --repo ${{ github.repository }} --json body --jq '.body // ""' 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

            # List release assets
            echo "Release assets:"
            gh release view "$tag" --repo ${{ github.repository }} --json assets --jq '.assets[].name'

            # Download .deb
            rm -rf /tmp/deb-notify
            mkdir -p /tmp/deb-notify
            gh release download "$tag" --repo ${{ github.repository }} \
              --pattern '*.deb' --dir /tmp/deb-notify || { echo "Download failed for $tag"; continue; }

            echo "Downloaded files:"
            ls -la /tmp/deb-notify/

            deb=$(ls /tmp/deb-notify/*.deb 2>/dev/null | head -1)
            if [ -z "$deb" ]; then
              echo "No .deb found after download"
              continue
            fi
            echo "deb=$deb"

            # Build caption (write to file to avoid shell expansion issues)
            {
              printf '<b>%s %s</b>\n%s\n<a href="%s">Разработчик</a>\n\n' \
                "$app" "$ver" "$desc" "$src"
              printf "\U0001F4DD WHAT'S NEW\n"
              printf '<blockquote>\n%s\n</blockquote>\n\n' "$body"
              printf "\U0001F4E6 <code>apt install %s</code>" "$app"
            } > /tmp/caption.html

            # Send via Python to avoid shell escaping issues
            RELEASE_TAG="$tag" DEB_PATH="$deb" SOURCE_URL="$src" CHANGELOG_URL="$changelog_url" python3 -c "
          import os, requests, sys
          token = os.environ['TG_TOKEN']
          chat_id = os.environ['TG_CHAT_ID']
          deb = os.environ['DEB_PATH']
          tag = os.environ['RELEASE_TAG']
          source_url = os.environ['SOURCE_URL'].rstrip('/')
          changelog_url = os.environ.get('CHANGELOG_URL', '').rstrip('/')
          # Extract owner/repo from https://github.com/owner/repo
          parts = source_url.split('github.com/')[-1]
          release_url = f'https://github.com/{parts}/releases/tag/{tag}'
          # Prefer CHANGELOG_URL; if it's a GitHub repo, append /releases/tag/{tag}
          if changelog_url:
              cl_parts = changelog_url.split('github.com/')[-1] if 'github.com/' in changelog_url else ''
              if cl_parts and '/' in cl_parts:
                  link = f'https://github.com/{cl_parts}/releases/tag/{tag}'
              else:
                  link = changelog_url
          else:
              link = release_url
          with open('/tmp/caption.html', errors='replace') as f:
              caption = f.read().strip()
          if len(caption) > 1024:
              truncated = caption[:1000]
              last_newline = truncated.rfind('\n')
              if last_newline > 0:
                  truncated = truncated[:last_newline]
              truncated = truncated + '\n...\n\n🔗 <a href=\"' + link + '\">Полный changelog</a>'
              if truncated.count('<blockquote>') > truncated.count('</blockquote>'):
                  truncated += '\n</blockquote>'
              caption = truncated
          r = requests.post(f'http://localhost:8081/bot{token}/sendDocument',
              data={'chat_id': chat_id, 'parse_mode': 'HTML', 'caption': caption},
              files={'document': open(deb, 'rb')})
          print(r.status_code, r.text[:500])
          if r.status_code != 200:
              sys.exit(1)
          "

            rm -rf /tmp/deb-notify
          done <<< "$apps"

          docker kill telegram-bot-api || true
